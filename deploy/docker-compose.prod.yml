# PROD stack — project name: biocollect-prod
# Host: biocollect.optimizesolux.com → app (API + SPA, port 3000)
#
# Prerequisite: shared-traefik on traefik-public
#               + optimize-common-infra (optimizesolux-common) recommended
# Start:
#   docker compose -f docker-compose.prod.yml --project-name biocollect-prod \
#     --env-file /opt/biocollect/prod/.env up -d

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: ${DB_USER:-biocollect}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-biocollect}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      optimizesolux-common:
        aliases: ["biocollect-db"]

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-https://auth.optimizesolux.com/realms/biocollect}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-biocollect-web}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-francis.ahonsou@gmail.com}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.optimizesolux.com}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_ACTIONS_CLIENT_ID: ${KEYCLOAK_ACTIONS_CLIENT_ID:-biocollect-web}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://biocollect.optimizesolux.com}
      NOTIFICATION_HUB_BASE_URL: ${NOTIFICATION_HUB_BASE_URL:-https://notification-api.optimizesolux.com}
      NOTIFICATION_HUB_FROM: ${NOTIFICATION_HUB_FROM:-notifications@optimizesolux.com}
      NOTIFICATION_HUB_OAUTH_TOKEN_URL: ${NOTIFICATION_HUB_OAUTH_TOKEN_URL:-https://auth.optimizesolux.com/realms/notification-hub/protocol/openid-connect/token}
      NOTIFICATION_HUB_OAUTH_CLIENT_ID: ${NOTIFICATION_HUB_OAUTH_CLIENT_ID:-biocollect-notification-sender}
      NOTIFICATION_HUB_OAUTH_CLIENT_SECRET: ${NOTIFICATION_HUB_OAUTH_CLIENT_SECRET:-}
    networks:
      - optimizesolux-common
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.biocollect-prod-app.rule=Host(`${APP_HOSTNAME:-biocollect.optimizesolux.com}`)"
      - "traefik.http.routers.biocollect-prod-app.entrypoints=websecure"
      - "traefik.http.routers.biocollect-prod-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.biocollect-prod-app.loadbalancer.server.port=3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  mysql_data:

networks:
  optimizesolux-common:
    external: true
  traefik-public:
    external: true
