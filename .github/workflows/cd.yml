name: BioCollect CD Pipeline

# CD Contabo (shared-traefik) :
# - push / merge sur release/** (après CI success) → deploy PROD
# - workflow_dispatch (promote) → déploie la dernière image publiée sur main
#
# Pattern bootstrap :
#   SSH → curl init.sh depuis GitHub → sync deploy/ → setup si besoin → deploy.sh

on:
  workflow_run:
    workflows: ["CI and GHCR publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        type: choice
        required: true
        default: promote
        options:
          - promote

jobs:
  resolve-image:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'release/')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      app_image: ${{ steps.resolve.outputs.app_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve last published app image
        id: resolve
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          REGISTRY="ghcr.io"
          IMAGE="$REGISTRY/aquila04/biocollect"

          if [[ -n "${GHCR_TOKEN:-}" && -n "${GHCR_USERNAME:-}" ]]; then
            echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin
          fi

          git fetch origin main --depth=200 2>/dev/null || git fetch origin main 2>/dev/null || true

          resolve_sha() {
            local start_sha sha short
            for start_sha in "$HEAD_SHA" "origin/main" "main"; do
              if ! git rev-parse --verify "${start_sha}^{commit}" >/dev/null 2>&1; then
                continue
              fi
              echo "Searching app image in history of $start_sha" >&2
              while read -r sha; do
                short="${sha:0:7}"
                if docker manifest inspect "$IMAGE:sha-$short" > /dev/null 2>&1; then
                  echo "Resolved from $start_sha history: $IMAGE:sha-$short" >&2
                  echo "$IMAGE:sha-$short"
                  return 0
                fi
              done < <(git log --format='%H' "$start_sha" | head -100)
            done

            if docker manifest inspect "$IMAGE:latest" > /dev/null 2>&1; then
              echo "Fallback to $IMAGE:latest" >&2
              echo "$IMAGE:latest"
              return 0
            fi

            echo "ERROR: No published image found for biocollect" >&2
            return 1
          }

          APP_IMAGE=$(resolve_sha)
          echo "Resolved app: $APP_IMAGE"
          echo "app_image=$APP_IMAGE" >> "$GITHUB_OUTPUT"

  deploy-prod:
    needs: resolve-image
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'release/')
    runs-on: ubuntu-latest
    name: Deploy to PROD (release/**)
    environment: prod
    steps:
      - name: Prepare SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Bootstrap & Deploy to PROD server
        env:
          APP_IMAGE: ${{ needs.resolve-image.outputs.app_image }}
          SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DB_USER: ${{ secrets.DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_APP_HOSTNAME: ${{ secrets.PROD_APP_HOSTNAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OAUTH_SERVER_URL: ${{ secrets.OAUTH_SERVER_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Deploying to PROD ($SERVER_HOST)"
          echo "  APP=$APP_IMAGE"

          REPO_RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/deploy"

          ssh -o StrictHostKeyChecking=no -i private_key "$SERVER_USER@$SERVER_HOST" bash << ENDSSH
          set -euo pipefail
          mkdir -p /opt/biocollect
          curl -sSL "${REPO_RAW}/init.sh" -o /opt/biocollect/init.sh
          chmod +x /opt/biocollect/init.sh
          ENDSSH

          INIT_ARGS=(
            prod
            "$APP_IMAGE"
            --ghcr-username "$GHCR_USERNAME"
            --ghcr-token "$GHCR_TOKEN"
            --db-user "$DB_USER"
            --db-password "$PROD_DB_PASSWORD"
            --db-name "$PROD_DB_NAME"
            --app-hostname-prod "$PROD_APP_HOSTNAME"
            --jwt-secret "$JWT_SECRET"
            --oauth-server-url "$OAUTH_SERVER_URL"
            --redis-database "7"
            --github-repo "$GITHUB_REPOSITORY"
          )

          REMOTE_CMD="sudo /opt/biocollect/init.sh $(printf '%q ' "${INIT_ARGS[@]}")"
          ssh -o StrictHostKeyChecking=no -i private_key "$SERVER_USER@$SERVER_HOST" "$REMOTE_CMD"

      - name: Cleanup SSH key
        if: always()
        run: rm -f private_key

  promote:
    needs: resolve-image
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote'
    runs-on: ubuntu-latest
    name: Promote main → PROD
    environment: prod
    steps:
      - name: Prepare SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Bootstrap & Deploy to PROD server
        env:
          APP_IMAGE: ${{ needs.resolve-image.outputs.app_image }}
          SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DB_USER: ${{ secrets.DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_APP_HOSTNAME: ${{ secrets.PROD_APP_HOSTNAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OAUTH_SERVER_URL: ${{ secrets.OAUTH_SERVER_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Promoting to PROD ($SERVER_HOST)"
          echo "  APP=$APP_IMAGE"

          REPO_RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/deploy"

          ssh -o StrictHostKeyChecking=no -i private_key "$SERVER_USER@$SERVER_HOST" bash << ENDSSH
          set -euo pipefail
          mkdir -p /opt/biocollect
          curl -sSL "${REPO_RAW}/init.sh" -o /opt/biocollect/init.sh
          chmod +x /opt/biocollect/init.sh
          ENDSSH

          INIT_ARGS=(
            prod
            "$APP_IMAGE"
            --ghcr-username "$GHCR_USERNAME"
            --ghcr-token "$GHCR_TOKEN"
            --db-user "$DB_USER"
            --db-password "$PROD_DB_PASSWORD"
            --db-name "$PROD_DB_NAME"
            --app-hostname-prod "$PROD_APP_HOSTNAME"
            --jwt-secret "$JWT_SECRET"
            --oauth-server-url "$OAUTH_SERVER_URL"
            --redis-database "7"
            --github-repo "$GITHUB_REPOSITORY"
          )

          REMOTE_CMD="sudo /opt/biocollect/init.sh $(printf '%q ' "${INIT_ARGS[@]}")"
          ssh -o StrictHostKeyChecking=no -i private_key "$SERVER_USER@$SERVER_HOST" "$REMOTE_CMD"

      - name: Cleanup SSH key
        if: always()
        run: rm -f private_key
